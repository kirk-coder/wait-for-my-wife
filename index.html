<body>

  <div class="container">
    <h1>Countdown to Event</h1>
    <div class="date-display">Target Date: October 18th, 2026</div>
    <div class="timer">
      <div class="box"><div id="days" class="number">00</div><div class="label">Days</div></div>
      <div class="box"><div id="hours" class="number">00</div><div class="label">Hours</div></div>
      <div class="box"><div id="minutes" class="number">00</div><div class="label">Minutes</div></div>
      <div class="box"><div id="seconds" class="number">00</div><div class="label">Seconds</div></div>
    </div>
    <br>
    <div> To my dear wife, Ben: I built this website to count down the time until you arrive in Australia. I can’t wait to spend the rest of my life with you</div>
  </div>

  <script>
    const targetDate = new Date("October 18, 2026 00:00:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;
     
      if (difference <= 0) {
        document.querySelector(".container").innerHTML = "<h1>The day has arrived!</h1>";
        clearInterval(timerInterval);
        return;
      }
      // Convert milliseconds to days, hours, minutes, seconds
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);


      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    const timerInterval = setInterval(updateCountdown, 1000);
  </script>

  </script>
